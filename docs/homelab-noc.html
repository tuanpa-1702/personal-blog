<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HomeLab NOC: mô phỏng hạ tầng homelab</title>
<style>
:root{--paper:#f9f9f8;--term:#101c26;--bar:#1b2c3a;--edge:#3d5668;--zone:#2a3f50;--fg:#d6e4ea;--dim:#8aa2b0;--ok:#6fd6b4;--cy:#5ad1c7;--am:#f0b04a;--rd:#ff7a63;--vi:#b79cff;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--paper);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.noc{max-width:1100px;margin:0 auto;background:var(--term);color:var(--fg);border-radius:12px;overflow:hidden;font-family:var(--mono)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;background:var(--bar);font-size:12px}
.top b{color:#fff;font-weight:600}
.live{color:var(--ok)}
.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.tabs button{font:12px var(--mono);color:var(--dim);background:none;border:1px solid var(--edge);border-radius:6px;padding:5px 10px;cursor:pointer}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-pressed=true]{background:#2a4254;color:#fff;border-color:#5a7b90}
.tabs button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--zone)}
.kpi div{background:var(--term);padding:10px 16px}
.kpi small{display:block;font-size:11px;color:var(--dim)}
.kpi strong{font-size:20px;font-weight:600}
svg{display:block;width:100%;height:auto;padding:4px 10px}
.zn{fill:none;stroke:var(--zone);stroke-dasharray:5 4}
.zn.sub{stroke:#22374a;stroke-dasharray:none}
.zl{font:600 10px var(--mono);fill:#5f7a8b;letter-spacing:.08em}
.el{font:11px var(--mono);fill:var(--dim)}
.lk{fill:none;stroke:var(--edge);stroke-width:2}
.lk.bad{stroke:var(--rd);stroke-dasharray:4 3;opacity:.7}
.lk.vpn{stroke:var(--ok);stroke-dasharray:7 5;opacity:.75}
.lk.store{stroke:var(--dim);stroke-dasharray:4 4}
.lk.dmz{stroke:var(--am);opacity:.6}
.n{fill:var(--bar);stroke:var(--edge)}
.nd.key .n{stroke:#5a7b90;stroke-width:1.5}
.nd.bad .n{fill:none;stroke:var(--rd);stroke-dasharray:4 3}
.nd.down .n{fill:#3a1f1f;stroke:var(--rd);stroke-dasharray:none}
.t{font:600 12px var(--mono);fill:var(--fg)}
.s{font:11px var(--mono);fill:var(--dim)}
.nd.bad .t,.nd.bad .s,.nd.down .t,.nd.down .s{fill:var(--rd)}
.pk.t{fill:var(--cy)}.pk.a{fill:var(--am)}.pk.r{fill:var(--rd)}.pk.v{fill:var(--vi)}.pk.g{fill:var(--ok)}
.xm{font:700 16px var(--mono);fill:var(--rd)}
.screen{height:170px;padding:12px 16px;background:#0b141c;font-size:13px;line-height:1.55;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;white-space:pre-wrap;word-break:break-all}
.p{color:var(--ok)}.d{color:var(--dim)}
.cur{display:inline-block;width:7px;height:14px;background:var(--fg);vertical-align:-2px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.sr{position:absolute;left:-9999px}
@media(max-width:700px){.kpi{grid-template-columns:repeat(2,1fr)}.tabs{margin-left:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
</head>
<body>
<section class="noc" aria-labelledby="hd">
  <h2 id="hd" class="sr">Mô phỏng hạ tầng homelab gồm FortiGate 60D, VPN, UniFi AC Lite, NAS DS920+ chạy Proxmox Backup Server và máy chủ Proxmox VE với các máy ảo giám sát, ứng dụng và lab</h2>
  <div class="top"><b>HomeLab NOC</b><span class="live">mô phỏng trực tiếp</span><div class="tabs" id="tabs"></div></div>
  <div class="kpi" aria-hidden="true">
    <div><small>Băng thông WAN</small><strong id="k1">0</strong></div>
    <div><small>Độ trễ p95</small><strong id="k2">0 ms</strong></div>
    <div><small>Đã chặn</small><strong id="k3" style="color:var(--rd)">0</strong></div>
    <div><small>VM đang chạy</small><strong id="k4">-</strong></div>
  </div>
  <svg id="svg" viewBox="0 0 1000 485" role="img"></svg>
  <div class="screen" id="scr" aria-hidden="true"></div>
</section>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
const el = (n,a,p) => { const e = document.createElementNS(NS,n); for (const k in a) e.setAttribute(k,a[k]); if (p) p.appendChild(e); return e; };

// [label, x, y, w, h, sub-zone?]
const ZONES = [
  ['INTERNET',10,15,150,120],
  ['EDGE · FIREWALL',300,15,200,95],
  ['VPN · FORTICLIENT',820,15,170,95],
  ['LAN · 172.16.16.0/24',10,140,980,135],
  ['PROXMOX VE · MÁY ẢO',10,290,980,180],
  ['GIÁM SÁT',20,318,315,142,1],
  ['ỨNG DỤNG',345,318,315,142,1],
  ['LAB / TEST',670,318,310,142,1]
];
// [id, x, y, w, h, title, sub, bad?, key?, third line]
const NODES = [
  ['inet',25,35,120,40,'Internet','Cloudflare'],
  ['bot',25,85,120,40,'Bot dò quét','port scan',1],
  ['fg',330,35,140,60,'FortiGate 60D','LAN GW .16.254',0,1,'DMZ GW .17.254'],
  ['remote',840,43,130,44,'Remote PC','IPSec VPN'],
  ['ap',30,195,120,44,'UniFi AC Lite','802.1X RADIUS'],
  ['pc',200,195,110,44,'PC','172.16.16.x'],
  ['nas',380,190,150,60,'DS920+ NAS','NFS 10.10.10.254',0,1,'PBS VM .10.252'],
  ['pve',720,190,150,60,'Proxmox VE','172.16.16.250',0,1,'vmbr0 · 1 · 2'],
  ['zab',35,385,95,44,'Zabbix','giám sát'],
  ['graf',135,385,95,44,'Grafana','dashboard'],
  ['gray',235,385,95,44,'Graylog','syslog'],
  ['next',355,385,85,44,'Nextcloud','lưu trữ'],
  ['web',445,385,120,44,'Web Server','172.16.17.253'],
  ['claw',570,385,85,44,'OpenClaw','app'],
  ['win',685,385,140,44,'Win Server 2016','lab'],
  ['pnet',835,385,135,44,'PNETLab','lab mạng']
];
const vm = c => `M795 250 V362 H${c} V385`;
const EDGES = {
  e_inet:'M145 55 H315 V60 H330',
  e_bot:'M145 105 H315 V80 H330',
  e_vpn:'M470 55 H840 V65',
  e_dmz:'M470 85 H690 V122 H850 V190',
  e_ap:'M400 95 V172 H90 V195',
  e_pc:'M400 95 V172 H255 V195',
  e_nas:'M400 95 V172 H455 V190',
  e_pve:'M400 95 V172 H780 V190',
  e_bk:'M530 220 H720',
  v_zab:vm(82), v_graf:vm(182), v_gray:vm(282),
  v_next:vm(397), v_web:vm(505), v_claw:vm(612),
  v_win:vm(755), v_pnet:vm(902)
};
const CLS = {e_bot:'bad', e_vpn:'vpn', e_bk:'store', e_dmz:'dmz'};
const svg = document.getElementById('svg');
ZONES.forEach(z => { el('rect',{x:z[1],y:z[2],width:z[3],height:z[4],rx:10,class:'zn'+(z[5]?' sub':'')},svg); const t = el('text',{x:z[1]+10,y:z[2]+16,class:'zl'},svg); t.textContent = z[0]; });
const E = {};
for (const k in EDGES) E[k] = el('path',{d:EDGES[k],class:'lk'+(CLS[k]?' '+CLS[k]:'')},svg);
[[625,212,'vmbr2 · 10.10.10.0/24 · NFS'],[655,47,'IPSec VPN · FortiClient'],[580,79,'DMZ · 172.16.17.0/24'],[770,116,'vmbr1 (không IP)'],[600,167,'vmbr0']]
  .forEach(([x,y,t]) => { el('text',{x,y,'text-anchor':'middle',class:'el'},svg).textContent = t; });
const ND = {};
NODES.forEach(n => {
  const g = el('g',{class:'nd'+(n[7]?' bad':'')+(n[8]?' key':'')},svg); ND[n[0]] = g;
  el('rect',{x:n[1],y:n[2],width:n[3],height:n[4],rx:6,class:'n'},g);
  const ty = n[9] ? 17 : n[4] > 44 ? 25 : 19;
  el('text',{x:n[1]+10,y:n[2]+ty,class:'t'},g).textContent = n[5];
  el('text',{x:n[1]+10,y:n[2]+ty+16,class:'s'},g).textContent = n[6];
  if (n[9]) el('text',{x:n[1]+10,y:n[2]+ty+31,class:'s'},g).textContent = n[9];
});
const pl = el('g',{},svg);

// A flow is a list of edges; '-e_x' walks that edge backwards.
// Real addressing from the anonyht posts (DMZ, PBS/NFS, UniFi RADIUS) and the
// web server itself; outputs marked "mô phỏng" in the caption are illustrative.
const DMZ = ['e_inet','e_dmz'];
const SC = [
 {tab:'Tổng quan', cap:'Truy cập anonyht.com / blog.tuanpa.tech: Internet → Cloudflare Tunnel → FortiGate → DMZ (vmbr1) → Web Server 172.16.17.253',
  rates:[[{es:[...DMZ,'v_web'],c:'t',reply:1},800],[{es:['e_inet','e_pve','v_next'],c:'t',reply:1},1500],[{es:['-e_ap','-e_inet'],c:'a'},1100],[{es:['-e_pc','-e_inet'],c:'a'},1600]],
  k:{bw:184,lat:12,blk:0,vm:'8/8'},
  cmds:[['ip -4 addr show ens18 | grep inet',['inet 172.16.17.253/24 brd 172.16.17.255 scope global ens18']],['ip route | head -1',['default via 172.16.17.254 dev ens18 proto static']],['systemctl is-active cloudflared',['active']],['pm2 ls --no-color | grep online',['anonyht   online','blog      online','english   online']]]},
 {tab:'VPN', cap:'Remote PC dùng FortiClient (IPSec client-to-site) vào FortiGate rồi tới máy lab trong LAN 172.16.16.0/24',
  rates:[[{es:['-e_vpn','e_pve','v_win'],c:'g',reply:1},1000],[{es:['-e_vpn','e_pve','v_pnet'],c:'g',reply:1},1400],[{es:[...DMZ,'v_web'],c:'t',reply:1},2200]],
  k:{bw:96,lat:28,blk:0,vm:'8/8'},
  cmds:[['get vpn ipsec tunnel summary',["'FortiClient_0' selectors(total,up): 1/1  rx(pkt,err): 1520/0  tx(pkt,err): 1388/0"]],['ping -c1 172.16.16.250',['64 bytes from 172.16.16.250: icmp_seq=1 ttl=63 time=18.4 ms']],['xfreerdp /v:win2016.lab',['[INFO] connected to win2016.lab:3389']]]},
 {tab:'Giám sát', cap:'Zabbix hỏi FortiGate (172.16.16.254) và NAS, FortiGate đẩy syslog về Graylog, Grafana vẽ dashboard từ Zabbix',
  rates:[[{es:['-v_zab','-e_pve'],c:'t',reply:1},1200],[{es:['-v_zab','-e_bk'],c:'t',reply:1},1500],[{es:['e_pve','v_gray'],c:'a'},700],[{es:['-v_graf','v_zab'],c:'v',reply:1},1800]],
  k:{bw:142,lat:14,blk:0,vm:'8/8'},
  cmds:[['snmpget -v2c -c *** 172.16.16.254 ifHCInOctets.1',['IF-MIB::ifHCInOctets.1 = Counter64: 23816544112']],['zabbix_get -s 10.10.10.254 -k "system.cpu.load[,avg5]"',['0.31']],['curl -s graylog:9000/api/system | jq .lifecycle',['"running"']]]},
 {tab:'Backup', cap:'Proxmox VE (vmbr2 10.10.10.253) sao lưu VM sang PBS 10.10.10.252; datastore là NFS 10.10.10.254:/volume1/ProxmoxBackup trên DS920+',
  rates:[[{es:['-e_bk'],c:'v'},350],[{es:['-v_web','-e_bk'],c:'v'},900],[{es:['-v_next','-e_bk'],c:'v'},1300],[{es:[...DMZ,'v_web'],c:'t',reply:1},2400]],
  k:{bw:61,lat:15,blk:0,vm:'8/8'},
  cmds:[['mount | grep ProxmoxBackup',['10.10.10.254:/volume1/ProxmoxBackup on /mnt/datastore/ProxmoxBackup type nfs']],['vzdump 109 --storage pbs --mode snapshot',['INFO: starting new backup job: vzdump 109','INFO: Finished Backup of VM 109']]]},
 {tab:'Chặn tấn công', cap:'Bot dò quét bị FortiGate chặn ở rìa; Web Server trong DMZ không vào được LAN 172.16.16.0/24 (rule Deny + Log)',
  rates:[[{es:['e_bot'],c:'r',f:.93},260],[{es:['-v_web','-e_dmz'],c:'r',f:.93},900],[{es:[...DMZ,'v_web'],c:'t',reply:1},1300],[{es:['e_pve','v_gray'],c:'a'},600]],
  k:{bw:171,lat:13,blk:11,vm:'8/8'},
  cmds:[['ping -c1 -W2 172.16.16.250',['1 packets transmitted, 0 received, 100% packet loss']],['curl -m 5 https://172.16.16.250:8006',['curl: (28) Connection timed out after 5001 milliseconds']],['execute log filter dstip 172.16.16.0/24',['action=deny srcip=172.16.17.253 dstip=172.16.16.250 dstport=8006']]]}
];

const tabs = document.getElementById('tabs'), scr = document.getElementById('scr');
SC.forEach((s,i) => { const b = document.createElement('button'); b.textContent = s.tab; b.setAttribute('aria-pressed','false'); b.onclick = () => play(i); tabs.appendChild(b); });
const sleep = ms => new Promise(r => setTimeout(r,ms));
let tok = 0, pk = [], blk = 0, cur = SC[0];

function spawn(fl){
  let segs = fl.es.map(s => s[0] === '-' ? {id:s.slice(1),r:true} : {id:s,r:false});
  if (fl.rev) segs = segs.reverse().map(s => ({id:s.id,r:!s.r}));
  const ps = segs.map(s => E[s.id]), rs = segs.map(s => s.r), lens = ps.map(p => p.getTotalLength());
  const c = el('circle',{r:fl.r||4,class:'pk '+fl.c},pl);
  pk.push({ps,rs,lens,tot:lens.reduce((a,b) => a+b,0),f:fl.f||1,c,d:0,fl});
}
function at(k,d){
  let i = 0;
  while (i < k.lens.length-1 && d > k.lens[i]){ d -= k.lens[i]; i++; }
  const L = k.lens[i], x = Math.min(d,L);
  return k.ps[i].getPointAtLength(k.rs[i] ? L-x : x);
}
function cross(pt){
  const x = el('text',{x:pt.x-5,y:pt.y+5,class:'xm'},pl); x.textContent = '×';
  setTimeout(() => x.remove(),700);
}
let last = 0;
function frame(ts){
  const dt = Math.min(.05,(ts-last)/1000); last = ts;
  for (let j = pk.length-1; j >= 0; j--){
    const k = pk[j]; k.d += 170*dt;
    const lim = k.tot*k.f;
    if (k.d >= lim){
      if (k.f < 1){ cross(at(k,lim)); blk++; }
      else if (k.fl.reply && !k.fl.rev) spawn({es:k.fl.es,rev:1,c:'a',r:3});
      k.c.remove(); pk.splice(j,1);
    } else { const pt = at(k,k.d); k.c.setAttribute('cx',pt.x); k.c.setAttribute('cy',pt.y); }
  }
  requestAnimationFrame(frame);
}
function rates(s,me){
  s.rates.forEach(([fl,ms]) => {
    const tick = () => {
      if (me !== tok) return;
      spawn(fl);
      setTimeout(tick, ms*(.7+Math.random()*.6));
    };
    tick();
  });
}
function kpi(){
  const k = cur.k, j = v => Math.round(v*(.94+Math.random()*.12));
  document.getElementById('k1').textContent = j(k.bw)+' Mbps';
  document.getElementById('k2').textContent = j(k.lat)+' ms';
  document.getElementById('k3').textContent = Math.round(blk);
  document.getElementById('k4').textContent = k.vm;
}
function add(cls){ const d = document.createElement('div'); if (cls) d.className = cls; scr.appendChild(d); while (scr.children.length > 9) scr.removeChild(scr.firstChild); return d; }
function prompt(){ const d = add(), p = document.createElement('span'); p.className = 'p'; p.textContent = '$ '; const t = document.createTextNode(''), c = document.createElement('span'); c.className = 'cur'; d.append(p,t,c); return {t,c}; }
async function play(i){
  const me = ++tok, s = SC[i]; cur = s;
  [...tabs.children].forEach((b,j) => b.setAttribute('aria-pressed',j === i));
  svg.setAttribute('aria-label',s.cap); // screen readers only, no visible caption
  for (const id in ND) ND[id].classList.toggle('down', s.down === id);
  pk.forEach(k => k.c.remove()); pk = []; blk = 0; scr.replaceChildren();
  kpi();
  if (!reduce) rates(s,me);
  let pr = prompt();
  for (const [c,o] of s.cmds){
    for (const ch of c){ pr.t.data += ch; if (!reduce) await sleep(26); if (me !== tok) return; }
    pr.c.remove();
    for (const l of o){ if (!reduce) await sleep(230); if (me !== tok) return; add('d').textContent = l; }
    pr = prompt();
    if (!reduce) await sleep(1400);
    if (me !== tok) return;
  }
  if (!reduce){ await sleep(2500); if (me === tok) play((i+1) % SC.length); }
}
if (!reduce){ requestAnimationFrame(frame); setInterval(() => { blk += cur.k.blk; kpi(); }, 1000); }
play(0);
</script>
</body>
</html>
