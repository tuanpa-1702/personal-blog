<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title data-page-name="Về tác giả">Về tác giả - AnonyHT</title>
<meta name="description" content="Về tác giả của blog - ảnh, tiểu sử và các kênh mạng xã hội.">
<meta name="theme-color" content="#f6f1e7" data-theme-color-dark="#1e1a16">
<!-- Favicon do admin đặt (Bảng quản trị > Quản lí trang chủ). server/render-html.js
     điền href từ bảng settings trước khi gửi; giá trị trống hoặc chưa đặt thì bỏ cả thẻ. -->
<link rel="icon" data-setting-href="favicon">
<!-- Theme switch. MUST stay here - blocking, in <head>, ahead of the
     stylesheets - so <html class="dark"> is set before the first paint.
     Deferring it (or folding it into api.js at the end of <body>) brings back
     the white flash on every navigation. -->
<script src="/js/theme.js"></script>

<!-- Fonts. Both families are SELF-HOSTED in /css/fonts.css, which
     scripts/fetch-fonts.py generates: Inter as the static faces
     Google serves per unicode-range (latin / latin-ext / vietnamese - the
     three a page of Vietnamese prose actually selects), Material Symbols as a
     subset of just the icons in use. Same-origin is the point: the first paint
     waits on no third party, the faces are discovered while this
     render-blocking stylesheet parses, and the hashed filenames are what lets
     server.js serve /fonts/ as immutable for a year.
     The faces the first paint sets text in are preloaded between the
     @generated markers below; fetch-fonts.py rewrites their hashed hrefs. -->
<link href="/css/fonts.css" rel="stylesheet">
<!-- @generated:font-preload -->
<link as="font" crossorigin href="/fonts/material-symbols-subset.c7d51076.woff2" rel="preload" type="font/woff2">
<link as="font" crossorigin href="/fonts/inter-n-400-latin.3100e775.woff2" rel="preload" type="font/woff2">
<link as="font" crossorigin href="/fonts/inter-n-400-vietnamese.5c66f9e0.woff2" rel="preload" type="font/woff2">
<!-- /@generated:font-preload -->

<!-- Editorial redesign (shared with the rest of the site) - see
     css/editorial.css. Newsreader is the headline display serif; preloaded
     here for the same reason as the two Inter faces above. Not
     @generated - hand-maintained, not part of the shared fetch-fonts.py
     pipeline. -->
<link as="font" crossorigin href="/fonts/newsreader-n-400-latin.62981321.woff2" rel="preload" type="font/woff2">
<link as="font" crossorigin href="/fonts/newsreader-n-400-vietnamese.f0dcc979.woff2" rel="preload" type="font/woff2">

<!-- Design tokens, then the utilities. tailwind.css is COMPILED (see
     tailwind.config.js + `npm run build:css`). Load order is deliberate -
     see common.css/editorial.css's own header comments for why tailwind.css
     has to load last. -->
<link href="/css/common.css" rel="stylesheet">
<link href="/css/tailwind.css" rel="stylesheet">
<link href="/css/editorial.css" rel="stylesheet">
<style>
  /* The page's shared reading-width container (max-w-3xl, same as
     terms.html) fits a wall of paragraph text but starved this two-column
     bio card: at 768px total width, a 2:1 photo:text split left the text
     column under 250px, wrapping every short sentence onto its own line
     (feedback, with a screenshot showing exactly that). This page's own
     <main> gets a wider cap instead - #about-main below - since a card
     this shape needs more like an article-grid page's width (max-w-7xl
     elsewhere) than a paragraph-of-prose page's. */
  #about-main { max-width: 72rem; }
  /* Portrait + text side by side, not stacked-and-centred. flex: 3 / flex: 2
     on two children of the same row is a 3:2 (60/40) split - photo still
     the visually larger element, but not so dominant that the text column
     is left too narrow to wrap naturally (was flex: 2 / flex: 1, a 2:1 split
     that combined with the narrower container above to squeeze the bio
     text down to one short word per line). Stacked on a phone (photo
     full-width on top, text below) - a 60/40 row has no room to be either
     column at a narrow width. */
  #author-card {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }
  @media (min-width: 640px) {
    #author-card { flex-direction: row; align-items: flex-start; }
  }
  .author-photo-col { width: 100%; }
  @media (min-width: 640px) {
    .author-photo-col { flex: 3; }
  }
  .author-text-col {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    text-align: center;
  }
  @media (min-width: 640px) {
    .author-text-col { flex: 2; align-items: flex-start; text-align: left; }
  }
  /* Square via aspect-ratio, not a fixed width/height like the small header
     avatar (.ed-byline-avatar) - this photo's actual size follows its
     column's own width (60% of the card, itself responsive), so a fixed px
     box would either float in empty space on a wide screen or overflow on a
     narrow one. */
  .author-photo {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    background: rgb(var(--ed-accent-soft));
  }
  /* A permanent rounded-square block around each social icon (feedback: the
     plain .ed-icon-btn underneath only ever gets a border/background on
     hover or focus, so before either of those the icons floated with no
     button chrome at all - only whichever one the reader last hovered
     looked like a real button, and every icon read differently depending on
     interaction state instead of all reading the same at rest). Same 8px
     corner radius as .author-photo, so the icon row and the portrait above
     it read as one family of rounded squares - "như Instagram" (the
     reference given): that app's own icon is exactly this shape, a rounded
     square holding one glyph. */
  .author-social-link {
    width: 2.5rem;
    height: 2.5rem;
    border: 1px solid rgb(var(--ed-divider));
    border-radius: 8px;
  }
  .author-social-link:hover {
    border-color: rgb(var(--ed-accent));
  }
</style>
</head>

<!-- Filled entirely client-side by js/about.js off GET /api/settings - the

<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16.6 3c.4 2.3 1.9 3.8 4.2 4.1v3.1c-1.5.1-2.9-.4-4.2-1.3v6.6c0 3.4-2.7 5.9-5.9 5.9S4.8 18.9 4.8 15.5c0-3.2 2.5-5.8 5.6-5.9v3.1c-1.5.2-2.6 1.4-2.6 2.9 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9V3h3z"/></svg>
